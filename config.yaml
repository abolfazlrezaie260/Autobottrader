# Mofid EasyTrader Automation Config
app:
  url: "https://d.easytrader.ir"
  # Browser connection mode:
  # - persistent: Automatically launch Chrome and persist session & profile locally
  # - cdp: Connect to existing browser running with --remote-debugging-port=9222
  connection_mode: "persistent"
  user_data_dir: "./browser_profile"
  cdp_endpoint: "http://127.0.0.1:9222"
  headless: false

order:
  symbol: "کرازی"          # Target stock symbol (نماد کرازی)
  side: "buy"              # buy or sell
  quantity: 0              # 0 to use maximum allowable volume
  use_max_quantity: true   # Auto-select maximum allowable volume via [data-cy='order-form-max-quantity']
  price: 0                 # 0 to use maximum ceiling price
  use_ceiling_price: true  # Auto-select maximum ceiling price via [data-cy='order-form-max-price']
  action_type: "draft"     # "draft" (ثبت پیش‌نویس) or "send" (ارسال مستقیم به هسته معاملات)

schedule:
  enabled: false           # If false, registers draft/order immediately; if true, waits for target_time
  target_time: "08:44:59.850"
  max_attempts: 1          # 1 attempt for draft
  interval_ms: 250

anti_detection:
  random_delay_min_ms: 60
  random_delay_max_ms: 180
  human_mouse_movement: true

storage:
  save_stocks_data: true   # Auto-save full data of each opened stock to a text file
  output_dir: "./stocks_data"
